<table mat-table [dataSource]="potionsList()" class="mat-elevation-z2">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let potion">{{ potion.name }}</td>
  </ng-container>

  <ng-container matColumnDef="effect">
    <th mat-header-cell *matHeaderCellDef>Effect</th>
    <td mat-cell *matCellDef="let potion">{{ potion.effect || 'Unknown' }}</td>
  </ng-container>

  <ng-container matColumnDef="difficulty">
    <th mat-header-cell *matHeaderCellDef>Difficulty</th>
    <td mat-cell *matCellDef="let potion">{{ potion.difficulty || 'Unknown' }}</td>
  </ng-container>

  <ng-container matColumnDef="ingredients">
    <th mat-header-cell *matHeaderCellDef>Ingredients</th>
    <td mat-cell *matCellDef="let potion">{{ potion.ingredients || 'Unknown' }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
