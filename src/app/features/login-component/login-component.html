<form (ngSubmit)="auth.loginWithRedirect()" #loginForm="ngForm">
  
  <!-- Email Field -->
  <div class="form-group">
    <label>Email address</label>
    <input
      #emailInput="ngModel"
      type="email"
      class="form-control"
      placeholder="Enter email"
      name="email"
      [(ngModel)]="email"
      required
      minlength="5"
    />
    @if (emailInput.invalid && emailInput.touched) {
      <span class="text-danger">Must be at least 5 characters and a valid email.</span>
    }
  </div>

  <!-- Password Field -->
  <div class="form-group">
    <label for="InputPassword">Password</label>
    <input
      type="password"
      class="form-control"
      placeholder="Password"
      name="password"
      [(ngModel)]="password"
      required
    />
  </div>

  <!-- Checkbox Field -->

  <!-- Submit Button -->
  <button type="submit" class="btn btn-primary" [disabled]="loading">
    @if (loading) {
      <span>Loading...</span>
    } @else {
      <span>Submit</span>
    }
  </button>
</form>
